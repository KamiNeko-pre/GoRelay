name: gorelay

x-logging: &bounded-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-backend-environment: &backend-environment
  GIN_MODE: release
  GOMEMLIMIT: 256MiB
  LUA_SPIDER_APP_PORT: 8080
  LUA_SPIDER_APP_PPROF_PORT: 0
  LUA_SPIDER_APP_PROXY: ""
  LUA_SPIDER_MYSQL_DSN: gorelay:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@tcp(mysql:3306)/gorelay?charset=utf8mb4&parseTime=True&loc=UTC
  LUA_SPIDER_REDIS_ADDR: redis:6379
  LUA_SPIDER_REDIS_STREAM: gorelay-tasks
  LUA_SPIDER_REDIS_CONSUMER_GROUP: gorelay-workers
  LUA_SPIDER_ENGINE_WORKER_COUNT: ${WORKERS:-2}
  LUA_SPIDER_ENGINE_LUA_TIMEOUT: 35

x-app: &app
  image: gorelay:${GORELAY_IMAGE_TAG:-local}
  logging: *bounded-logging
  build: {context: .., target: runtime}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  volumes:
    - type: bind
      source: ${GORELAY_SPEND_POLICY_FILE:-../configs/agentbench/spend-policy.example.json}
      target: /app/configs/spend-policy.json
      read_only: true
      bind: {create_host_path: false}
  environment: &environment
    <<: *backend-environment
    GIN_MODE: release
    GOMEMLIMIT: 256MiB
    LUA_SPIDER_APP_PORT: 8080
    LUA_SPIDER_APP_PPROF_PORT: 0
    LUA_SPIDER_APP_PROXY: ""
    LUA_SPIDER_MYSQL_DSN: gorelay:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@tcp(mysql:3306)/gorelay?charset=utf8mb4&parseTime=True&loc=UTC
    LUA_SPIDER_REDIS_ADDR: redis:6379
    LUA_SPIDER_REDIS_STREAM: gorelay-tasks
    LUA_SPIDER_REDIS_CONSUMER_GROUP: gorelay-workers
    LUA_SPIDER_ENGINE_WORKER_COUNT: ${WORKERS:-2}
    LUA_SPIDER_ENGINE_LUA_TIMEOUT: 35
    GORELAY_ADMIN_TOKEN: ${GORELAY_ADMIN_TOKEN:?set GORELAY_ADMIN_TOKEN}
    GORELAY_DEMO_DAILY_RUNS: ${GORELAY_DEMO_DAILY_RUNS:-20}
    GORELAY_SPEND_POLICY_PATH: ${GORELAY_SPEND_POLICY_PATH:-}
    GORELAY_RUN_MODEL_CALLS: ${GORELAY_RUN_MODEL_CALLS:-12}
    GORELAY_RUN_SEARCH_CALLS: ${GORELAY_RUN_SEARCH_CALLS:-3}
    GORELAY_RUN_STAGNATION_CALLS: ${GORELAY_RUN_STAGNATION_CALLS:-6}
    GORELAY_RUN_TIMEOUT: ${GORELAY_RUN_TIMEOUT:-15m}
    GORELAY_AGENT_CONCURRENCY: ${GORELAY_AGENT_CONCURRENCY:-2}
    GORELAY_ACQUISITION_PROXY: ${GORELAY_ACQUISITION_PROXY:-}
    GORELAY_ACTION_MODE: ${GORELAY_ACTION_MODE:-code}
    GORELAY_DISABLE_CAPABILITY_REUSE: ${GORELAY_DISABLE_CAPABILITY_REUSE:-false}
    GORELAY_DISABLE_KNOWLEDGE_REUSE: ${GORELAY_DISABLE_KNOWLEDGE_REUSE:-false}
    GORELAY_INDEX_FORCE_REBUILD: ${GORELAY_INDEX_FORCE_REBUILD:-false}
    GORELAY_RUNNER_URL: http://lua-runner:8091
    GORELAY_RUNNER_TOKEN: ${GORELAY_RUNNER_TOKEN:?set GORELAY_RUNNER_TOKEN}
    GORELAY_AI_BASE_URL: ${GORELAY_AI_BASE_URL:-}
    GORELAY_AI_MODEL: ${GORELAY_AI_MODEL:-}
    GORELAY_AI_API_KEY: ${GORELAY_AI_API_KEY:-}
    GORELAY_EMBED_BASE_URL: ${GORELAY_EMBED_BASE_URL:-}
    GORELAY_EMBED_MODEL: ${GORELAY_EMBED_MODEL:-}
    GORELAY_EMBED_API_KEY: ${GORELAY_EMBED_API_KEY:-}
    GORELAY_EMBED_DIMENSIONS: ${GORELAY_EMBED_DIMENSIONS:-}
    GORELAY_SEARCH_API_KEY: ${GORELAY_SEARCH_API_KEY:-}
    GORELAY_SEARCH_ENDPOINT: ${GORELAY_SEARCH_ENDPOINT:-https://api.search.brave.com/res/v1/web/search}
    GORELAY_QDRANT_URL: http://qdrant:6333
    GORELAY_QDRANT_COLLECTION: ${GORELAY_QDRANT_COLLECTION:-gorelay}
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}
  mem_limit: 384m
  pids_limit: 128

services:
  mysql:
    image: mysql:8.4
    logging: *bounded-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gorelay
      MYSQL_USER: gorelay
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 1g
  redis:
    image: redis:7.4-alpine
    logging: *bounded-logging
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
  qdrant:
    image: qdrant/qdrant:v1.19.0
    healthcheck:
      test: [CMD-SHELL, 'bash -ec ''exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; IFS= read -r status <&3; [[ "$$status" == *" 200 "* ]]''']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *bounded-logging
    volumes: [qdrant-data:/qdrant/storage]
    restart: unless-stopped
    mem_limit: 512m
  app:
    <<: *app
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
  publisher:

    # Ordinary task publication has no Agent scheduler.
    <<: *app
    command: [/app/publisher]
    environment: *backend-environment
    depends_on:
      app: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    command: [/app/worker]
    environment:
      <<: *backend-environment
      GORELAY_RUNNER_URL: http://lua-runner:8091
      GORELAY_RUNNER_TOKEN: ${GORELAY_RUNNER_TOKEN:?set GORELAY_RUNNER_TOKEN}
      GORELAY_EMBED_BASE_URL: ${GORELAY_EMBED_BASE_URL:-}
      GORELAY_EMBED_MODEL: ${GORELAY_EMBED_MODEL:-}
      GORELAY_EMBED_DIMENSIONS: ${GORELAY_EMBED_DIMENSIONS:-}
      GORELAY_CHUNK_RUNES: ${GORELAY_CHUNK_RUNES:-600}
      GORELAY_CHUNK_OVERLAP: ${GORELAY_CHUNK_OVERLAP:-80}
    volumes: []
    depends_on:
      app: {condition: service_healthy}
      lua-runner: {condition: service_healthy}
  agent-worker:
    <<: *app
    command: [/app/agent-worker]
    depends_on:
      app: {condition: service_healthy}
      lua-runner: {condition: service_healthy}
  indexer:
    <<: *app
    command: [/app/indexer]
    profiles: [indexing]
    restart: "on-failure:3"
    depends_on:
      app: {condition: service_healthy}
      qdrant: {condition: service_healthy}
  lua-runner:
    image: gorelay-runner:${GORELAY_IMAGE_TAG:-local}
    logging: *bounded-logging
    build: {context: .., dockerfile: Dockerfile.runner}
    environment:
      GORELAY_RUNNER_TOKEN: ${GORELAY_RUNNER_TOKEN:?set GORELAY_RUNNER_TOKEN}
      GORELAY_ACQUISITION_PROXY: ${GORELAY_ACQUISITION_PROXY:-}
      GOMEMLIMIT: 96MiB
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 192m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8091/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
  edge:
    image: caddy:2.10.2-alpine
    logging: *bounded-logging
    environment:
      GORELAY_SITE_ADDRESS: ${GORELAY_SITE_ADDRESS:-http://:80}
      GORELAY_ADMIN_TOKEN: ${GORELAY_ADMIN_TOKEN:?set GORELAY_ADMIN_TOKEN}
    ports:
      - ${GORELAY_BIND:-127.0.0.1}:${GORELAY_HTTP_PORT:-5088}:80
      - ${GORELAY_BIND:-127.0.0.1}:${GORELAY_HTTPS_PORT:-5443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  caddy-data:
  caddy-config:
