name: gorelay

x-logging: &bounded-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-backend-environment: &backend-environment
  GIN_MODE: release
  GOMEMLIMIT: 256MiB
  GORELAY_APP_PORT: 8080
  GORELAY_APP_PPROF_PORT: 0
  GORELAY_APP_PROXY: ""
  GORELAY_MYSQL_DSN: gorelay:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@tcp(mysql:3306)/gorelay?charset=utf8mb4&parseTime=True&loc=UTC
  GORELAY_REDIS_ADDR: redis:6379
  GORELAY_REDIS_STREAM: gorelay:tasks
  GORELAY_REDIS_CONSUMER_GROUP: gorelay-workers
  GORELAY_ENGINE_WORKER_COUNT: ${WORKERS:-4}
  GORELAY_ENGINE_LUA_TIMEOUT: 45

x-app: &app
  image: gorelay:${GORELAY_IMAGE_TAG:-local}
  logging: *bounded-logging
  build: {context: .., target: runtime}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  environment: &environment
    <<: *backend-environment
    GORELAY_ADMIN_TOKEN: ${GORELAY_ADMIN_TOKEN:?set GORELAY_ADMIN_TOKEN}
    GORELAY_RUNNER_URL: http://lua-runner:8091
    GORELAY_RUNNER_TOKEN: ${GORELAY_RUNNER_TOKEN:?set GORELAY_RUNNER_TOKEN}
    GORELAY_RESPECT_ROBOTS: ${GORELAY_RESPECT_ROBOTS:-true}
    GORELAY_ACQUISITION_PROXY: ${GORELAY_ACQUISITION_PROXY:-}
    GORELAY_AUTH_PROFILES_JSON: ${GORELAY_AUTH_PROFILES_JSON:-}
    GORELAY_BROWSER_CDP_URL: ${GORELAY_BROWSER_CDP_URL:-}
    GORELAY_BROWSER_CDP_TOKEN: ${GORELAY_BROWSER_CDP_TOKEN:-}
    GORELAY_SNAPSHOT_DIR: /app/data/snapshots
    GORELAY_CANARY_ENABLED: ${GORELAY_CANARY_ENABLED:-false}
  volumes:
    - snapshot-data:/app/data/snapshots
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}
  mem_limit: 256m
  pids_limit: 128

services:
  mysql:
    image: mysql:8.4
    logging: *bounded-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gorelay
      MYSQL_USER: gorelay
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 768m

  redis:
    image: redis:7.4-alpine
    logging: *bounded-logging
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 192m

  lua-runner:
    image: gorelay-runner:${GORELAY_IMAGE_TAG:-local}
    logging: *bounded-logging
    build: {context: .., dockerfile: Dockerfile.runner}
    environment:
      GORELAY_RUNNER_TOKEN: ${GORELAY_RUNNER_TOKEN:?set GORELAY_RUNNER_TOKEN}
      GORELAY_RESPECT_ROBOTS: ${GORELAY_RESPECT_ROBOTS:-true}
      GORELAY_ACQUISITION_PROXY: ${GORELAY_ACQUISITION_PROXY:-}
      GORELAY_AUTH_PROFILES_JSON: ${GORELAY_AUTH_PROFILES_JSON:-}
      GORELAY_BROWSER_CDP_URL: ${GORELAY_BROWSER_CDP_URL:-}
      GORELAY_BROWSER_CDP_TOKEN: ${GORELAY_BROWSER_CDP_TOKEN:-}
      GOMEMLIMIT: 96MiB
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 192m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8091/healthz]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    <<: *app
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      lua-runner: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20

  publisher:
    <<: *app
    command: [/app/publisher]
    environment: *backend-environment
    volumes: []
    depends_on:
      app: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    command: [/app/worker]
    environment:
      <<: *environment
      GORELAY_CHECKPOINT_LISTEN: :8092
      GORELAY_CHECKPOINT_BASE_URL: http://worker:8092
    depends_on:
      app: {condition: service_healthy}
      lua-runner: {condition: service_healthy}

  edge:
    image: caddy:2.10.2-alpine
    logging: *bounded-logging
    environment:
      GORELAY_SITE_ADDRESS: ${GORELAY_SITE_ADDRESS:-http://:80}
      GORELAY_ADMIN_TOKEN: ${GORELAY_ADMIN_TOKEN:?set GORELAY_ADMIN_TOKEN}
    ports:
      - ${GORELAY_BIND:-127.0.0.1}:${GORELAY_HTTP_PORT:-5088}:80
      - ${GORELAY_BIND:-127.0.0.1}:${GORELAY_HTTPS_PORT:-5443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  snapshot-data:
  caddy-data:
  caddy-config:
