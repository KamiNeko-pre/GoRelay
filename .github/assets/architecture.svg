<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">GoRelay 进程与数据流拓扑</title>
  <desc id="desc">展示 MCP Client、app 服务、MySQL、publisher、Redis Streams、worker、lua-runner 子进程、SafeClient 与外部目标源之间的运行拓扑。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 2l7 3-7 3z" fill="#64748b"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 2l7 3-7 3z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="428.5" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <!-- Header & Legend -->
    <text x="32" y="36" fill="#0f172a" font-size="15" font-weight="600">运行拓扑与进程边界</text>
    <line x1="774" y1="31" x2="804" y2="31" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="812" y="35" fill="#475569" font-size="12.5">缓存直读 / 视图查询</text>
    <line x1="948" y1="31" x2="978" y2="31" stroke="#64748b" stroke-width="1.8"/>
    <text x="986" y="35" fill="#475569" font-size="12.5">异步调度与隔离抓取</text>
    <path d="M32 52h1136" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Group Background: GoRelay Docker Stack -->
    <rect x="210" y="68" width="790" height="332" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4 4"/>
    <text x="228" y="90" fill="#64748b" font-size="11.5" font-weight="600" font-family="ui-monospace,Consolas,monospace">GoRelay Stack (Docker Compose)</text>

    <!-- Node 1: MCP Client (Outside Stack, Left) -->
    <rect x="28" y="182" width="144" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="100" y="216" text-anchor="middle" fill="#0f172a" font-size="15.5" font-weight="700">MCP Client</text>
    <text x="100" y="240" text-anchor="middle" fill="#475569" font-size="12.5">Claude Code</text>
    <text x="100" y="260" text-anchor="middle" fill="#475569" font-size="12.5">Cursor / Codex</text>

    <!-- Node 2: app (:8080) -->
    <rect x="230" y="168" width="154" height="124" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
    <text x="307" y="196" text-anchor="middle" fill="#0f766e" font-size="11.5" font-weight="700" font-family="ui-monospace,Consolas,monospace">app :8080</text>
    <text x="307" y="220" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">MCP 与管理入口</text>
    <text x="307" y="245" text-anchor="middle" fill="#475569" font-size="12">固定 6 工具 · 试跑校验</text>
    <text x="307" y="266" text-anchor="middle" fill="#475569" font-size="12">多视图查询 · 流式导出</text>

    <!-- Node 3: MySQL + Snapshots (Bottom Center) -->
    <rect x="430" y="276" width="214" height="104" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="537" y="302" text-anchor="middle" fill="#475569" font-size="11.5" font-weight="700" font-family="ui-monospace,Consolas,monospace">MySQL 8.4 + Disk</text>
    <text x="537" y="325" text-anchor="middle" fill="#0f172a" font-size="14.5" font-weight="700">连接器 · 记录 · 快照</text>
    <text x="537" y="348" text-anchor="middle" fill="#475569" font-size="12">版本表 · Outbox · source_records</text>
    <text x="537" y="367" text-anchor="middle" fill="#64748b" font-size="11.5">SHA-256 Gzip 归档 + BM25</text>

    <!-- Node 4: Publisher + Redis Streams (Top Center) -->
    <rect x="430" y="106" width="214" height="114" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="537" y="132" text-anchor="middle" fill="#475569" font-size="11.5" font-weight="700" font-family="ui-monospace,Consolas,monospace">publisher → redis 7.4</text>
    <text x="537" y="156" text-anchor="middle" fill="#0f172a" font-size="14.5" font-weight="700">Outbox 投递与队列</text>
    <text x="537" y="180" text-anchor="middle" fill="#475569" font-size="12">100ms 轮询补投 · Redis Streams</text>
    <text x="537" y="201" text-anchor="middle" fill="#64748b" font-size="11.5">消费组 + PEL 超时重试</text>

    <!-- Node 5: Worker + Sandbox (Top Right inside Stack) -->
    <rect x="692" y="106" width="288" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="836" y="132" text-anchor="middle" fill="#475569" font-size="11.5" font-weight="700" font-family="ui-monospace,Consolas,monospace">worker + lua-runner (-child)</text>
    <text x="836" y="156" text-anchor="middle" fill="#0f172a" font-size="14.5" font-weight="700">可靠执行与进程沙箱</text>
    <text x="836" y="180" text-anchor="middle" fill="#475569" font-size="12">租约续期 · XAUTOCLAIM · CAS 断点续跑</text>
    <text x="836" y="201" text-anchor="middle" fill="#475569" font-size="12">http_api 执行器 | 只读 FS 无密钥 Lua 沙箱</text>
    <text x="836" y="221" text-anchor="middle" fill="#64748b" font-size="11.5">落库前经 Drift 门禁校验，异常回滚不覆写旧数据</text>

    <!-- Node 6: SafeClient Proxy (Bottom Right inside Stack) -->
    <rect x="692" y="276" width="288" height="104" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
    <text x="836" y="302" text-anchor="middle" fill="#0f766e" font-size="11.5" font-weight="700" font-family="ui-monospace,Consolas,monospace">SafeClient (Shared Outbound)</text>
    <text x="836" y="325" text-anchor="middle" fill="#0f172a" font-size="14.5" font-weight="700">统一出网代理与护栏</text>
    <text x="836" y="348" text-anchor="middle" fill="#334155" font-size="12">SSRF 阻断 · robots.txt · 单域名限速</text>
    <text x="836" y="367" text-anchor="middle" fill="#475569" font-size="12">429 熔断 · 5 MiB 上限 · 域名凭据注入</text>

    <!-- Node 7: External Target Sites (Outside Stack, Far Right) -->
    <rect x="1032" y="276" width="140" height="104" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="1102" y="314" text-anchor="middle" fill="#0f172a" font-size="15" font-weight="700">外部目标源</text>
    <text x="1102" y="338" text-anchor="middle" fill="#475569" font-size="12.5">公开 JSON API</text>
    <text x="1102" y="358" text-anchor="middle" fill="#475569" font-size="12.5">静态 / 动态网页</text>

    <!-- Connectors -->
    <!-- Client <-> app -->
    <path d="M174 230h50" stroke="#64748b" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="199" y="220" text-anchor="middle" fill="#64748b" font-size="11" font-family="ui-monospace,Consolas,monospace">MCP</text>

    <!-- app -> MySQL (write task+outbox / fast cache read) -->
    <path d="M307 292v36h118" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="5 3" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>
    <text x="364" y="345" text-anchor="middle" fill="#0f766e" font-size="11.5">读写缓存 / 下单</text>

    <!-- MySQL Outbox -> Publisher/Redis -->
    <path d="M537 274v-49" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="583" y="253" text-anchor="middle" fill="#64748b" font-size="11">Outbox 捞取</text>

    <!-- Redis -> Worker -->
    <path d="M646 163h41" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Worker -> MySQL (Drift checked commit) -->
    <path d="M690 212l-44 82" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="674" y="264" fill="#64748b" font-size="11">入库</text>

    <!-- Worker <-> SafeClient (IPC) -->
    <path d="M836 238v33" fill="none" stroke="#64748b" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="874" y="258" fill="#64748b" font-size="11" font-family="ui-monospace,Consolas,monospace">IPC 代理</text>

    <!-- SafeClient <-> External Target -->
    <path d="M982 328h45" fill="none" stroke="#64748b" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="1005" y="318" text-anchor="middle" fill="#64748b" font-size="10.5" font-family="ui-monospace,Consolas,monospace">HTTP</text>
  </g>
</svg>
