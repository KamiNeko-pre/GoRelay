<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-labelledby="title"><title id="title">GoRelay 的 Agent、执行与知识三层架构</title><rect x="1" y="1" width="638" height="938" rx="12" fill="#f6f9fa" stroke="#dce5e7"/><g font-family="Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="28" y="40" font-size="25" font-weight="600" fill="#445e65">从能力构建，走向持续交付</text><rect x="24" y="70" width="592" height="234" rx="10" fill="#fff" stroke="#ccdadd"/><text x="48" y="107" fill="#176b65" font-size="22" font-weight="600">AGENT</text><text x="48" y="152" fill="#19343d" font-size="34" font-weight="700">规划与工具构建</text><text x="48" y="196" fill="#405b63" font-size="26">目标理解 → 观察 → 行动 → 检查</text><text x="48" y="234" fill="#405b63" font-size="26">Lua 生成、验证与工具注册</text><text x="48" y="272" fill="#405b63" font-size="26">执行反馈纠错 · 停滞检测</text><path d="M320 314v24m-6-6 6 6 6-6" stroke="#7f969c" stroke-width="2" fill="none"/><rect x="24" y="350" width="592" height="234" rx="10" fill="#fff" stroke="#ccdadd"/><text x="48" y="387" fill="#2c5f9c" font-size="22" font-weight="600">EXECUTION</text><text x="48" y="432" fill="#19343d" font-size="34" font-weight="700">可靠调度与执行</text><text x="48" y="476" fill="#405b63" font-size="26">API / Lua / 按需授权 Browser</text><text x="48" y="514" fill="#405b63" font-size="26">Outbox → Redis Streams → Worker</text><text x="48" y="552" fill="#405b63" font-size="26">隔离 Runner · 租约与故障接管</text><path d="M320 594v24m-6-6 6 6 6-6" stroke="#7f969c" stroke-width="2" fill="none"/><rect x="24" y="630" width="592" height="234" rx="10" fill="#fff" stroke="#ccdadd"/><text x="48" y="667" fill="#8a5a24" font-size="22" font-weight="600">KNOWLEDGE</text><text x="48" y="712" fill="#19343d" font-size="34" font-weight="700">数据沉淀与检索</text><text x="48" y="756" fill="#405b63" font-size="26">结构化记录 · 来源与版本</text><text x="48" y="794" fill="#405b63" font-size="26">独立索引 · BM25 / 向量 / RRF</text><text x="48" y="832" fill="#405b63" font-size="26">证据检索 · 原文引用与追溯</text><text x="320" y="909" text-anchor="middle" font-size="24" fill="#526b72">执行反馈回到 Agent，按需修复</text></g></svg>