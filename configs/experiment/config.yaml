app:
  port: 8080
  proxy: ""
  pprof_port: 6060

mysql:
  dsn: ""
  max_idle_conns: 4
  max_open_conns: 20

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  stream: "crawler:tasks"
  consumer_group: "crawler-workers"
  claim_min_idle_ms: 120000
  claim_interval_ms: 15000

publisher:
  batch_size: 100
  poll_interval_ms: 1000
  batch_timeout_seconds: 10

engine:
  worker_count: 8
  lua_timeout: 60
  http_timeout_direct: 5
  http_timeout_proxy: 15
