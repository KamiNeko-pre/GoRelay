app:
    port: 8080
    proxy: "http://host.docker.internal:7897"
    pprof_port: 0

mysql:
    # Set LUA_SPIDER_MYSQL_DSN in the local environment before starting.
    dsn: ""
    max_idle_conns: 10
    max_open_conns: 100

redis:
    addr: "127.0.0.1:6379"
    password: ""
    db: 0
    stream: "crawler:tasks"
    consumer_group: "crawler-workers"

publisher:
    batch_size: 100
    poll_interval_ms: 1000
    batch_timeout_seconds: 10

engine:
    worker_count: 8
    lua_timeout: 60
    http_timeout_direct: 5
    http_timeout_proxy: 15
