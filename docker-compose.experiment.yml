name: lua-spider-scale-v1

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: lua_crawler
    command: ["--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - scale-v1-mysql-data:/var/lib/mysql
    cpus: 1.0
    mem_limit: 1g

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - scale-v1-redis-data:/data
    cpus: 0.5
    mem_limit: 256m

  app:
    build:
      context: .
      target: runtime
    environment:
      GIN_MODE: release
      LUA_SPIDER_CONFIG: /app/experiment/config.yaml
      LUA_SPIDER_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/lua_crawler?charset=utf8mb4&parseTime=True&loc=UTC
      LUA_SPIDER_MYSQL_MAX_OPEN_CONNS: 20
      LUA_SPIDER_MYSQL_MAX_IDLE_CONNS: 5
      LUA_SPIDER_REDIS_ADDR: redis:6379
    volumes:
      - ./configs/experiment/config.yaml:/app/experiment/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: 0.25
    mem_limit: 128m

  publisher:
    build:
      context: .
      target: runtime
    command: ["/app/publisher"]
    environment:
      LUA_SPIDER_CONFIG: /app/experiment/config.yaml
      LUA_SPIDER_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/lua_crawler?charset=utf8mb4&parseTime=True&loc=UTC
      LUA_SPIDER_MYSQL_MAX_OPEN_CONNS: 5
      LUA_SPIDER_MYSQL_MAX_IDLE_CONNS: 2
      LUA_SPIDER_REDIS_ADDR: redis:6379
    volumes:
      - ./configs/experiment/config.yaml:/app/experiment/config.yaml:ro
    depends_on:
      app:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 128m

  worker:
    build:
      context: .
      target: runtime
    command: ["/app/worker"]
    environment:
      LUA_SPIDER_CONFIG: /app/experiment/config.yaml
      LUA_SPIDER_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/lua_crawler?charset=utf8mb4&parseTime=True&loc=UTC
      LUA_SPIDER_MYSQL_MAX_OPEN_CONNS: 20
      LUA_SPIDER_MYSQL_MAX_IDLE_CONNS: 4
      LUA_SPIDER_REDIS_ADDR: redis:6379
      LUA_SPIDER_ENGINE_WORKER_COUNT: 8
      LUA_SPIDER_RULES_FILE: /app/configs/rules.yaml
    volumes:
      - ./configs/experiment/config.yaml:/app/experiment/config.yaml:ro
    depends_on:
      app:
        condition: service_healthy
    cpus: 1.5
    mem_limit: 768m

volumes:
  scale-v1-mysql-data:
  scale-v1-redis-data:
