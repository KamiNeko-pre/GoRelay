x-logging: &bounded-logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  mysql:
    image: mysql:8.4
    logging: *bounded-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: lua_crawler
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    logging: *bounded-logging
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  app:
    image: gorelay:${GORELAY_IMAGE_TAG:-local}
    logging: *bounded-logging
    build:
      context: .
      target: runtime
    environment:
      GIN_MODE: release
      LUA_SPIDER_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/lua_crawler?charset=utf8mb4&parseTime=True&loc=UTC
      LUA_SPIDER_REDIS_ADDR: redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  publisher:
    image: gorelay:${GORELAY_IMAGE_TAG:-local}
    logging: *bounded-logging
    build:
      context: .
      target: runtime
    command: ["/app/publisher"]
    environment:
      LUA_SPIDER_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/lua_crawler?charset=utf8mb4&parseTime=True&loc=UTC
      LUA_SPIDER_REDIS_ADDR: redis:6379
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: gorelay:${GORELAY_IMAGE_TAG:-local}
    logging: *bounded-logging
    build:
      context: .
      target: runtime
    command: ["/app/worker"]
    environment:
      LUA_SPIDER_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/lua_crawler?charset=utf8mb4&parseTime=True&loc=UTC
      LUA_SPIDER_REDIS_ADDR: redis:6379
      LUA_SPIDER_ENGINE_WORKER_COUNT: ${WORKERS:-8}
      LUA_SPIDER_RULES_FILE: /app/configs/rules.yaml
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
