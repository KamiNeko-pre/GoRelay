<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GoRelay · 任务与数据工作台</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260905b" />
    <script defer src="/assets/vendor/echarts.min.js"></script>
    <script defer src="/assets/vendor/lucide.min.js"></script>
    <script type="module" src="/assets/app.js?v=20260905b"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主内容</a>
    <aside class="sidebar">
      <a class="brand" href="#analysis"
        ><span class="brand-symbol"><i data-lucide="layers-2"></i></span
        ><span>GoRelay<small>任务与数据工作台</small></span></a
      >
      <div class="workspace-label">
        <span class="workspace-avatar">L</span><span>本地工作空间</span
        ><i data-lucide="chevrons-up-down"></i>
      </div>
      <nav aria-label="主导航" class="nav">
        <a href="#analysis" data-view="analysis" class="active" title="数据分析"
          ><i data-lucide="chart-no-axes-combined"></i>数据分析</a
        >
        <a href="#compare" data-view="compare" title="快照对比"
          ><i data-lucide="git-compare-arrows"></i>快照对比</a
        >
        <a href="#health" data-view="health" title="规则健康"
          ><i data-lucide="activity"></i>规则健康<span
            id="health-nav-count"
            class="nav-count"
          ></span
        ></a>
        <a href="#runs" data-view="runs" title="运行日志"
          ><i data-lucide="logs"></i>运行日志</a
        >
      </nav>
      <div class="source-heading">
        数据来源 <span id="sidebar-source-count">0</span>
      </div>
      <nav id="source-nav" class="source-nav" aria-label="数据来源">
        <span class="muted">正在连接…</span>
      </nav>
      <div class="sidebar-bottom">
        <span class="status-dot" id="connection-dot"></span
        ><span id="connection-state">连接中</span
        ><span class="local-tag">LOCAL</span>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb">
          工作空间 <span>/</span> <strong id="breadcrumb-view">数据分析</strong>
        </div>
        <div class="topbar-right">
          <span id="last-sync" class="muted">等待同步</span
          ><button
            id="refresh"
            class="icon-button"
            title="刷新数据"
            aria-label="刷新数据"
          >
            <i data-lucide="refresh-cw"></i></button
          ><span class="avatar">LS</span>
        </div>
      </header>
      <main id="main">
        <div class="page-heading">
          <div>
            <h1 id="page-title">数据分析</h1>
            <p id="page-subtitle">公开数据的持续观察与变化追踪</p>
          </div>
          <button id="collect" class="primary">
            <i data-lucide="play"></i><span>开始采集</span>
          </button>
        </div>
        <div id="notice" role="status" hidden></div>
        <div id="error-banner" role="alert" hidden></div>
        <div class="scope-bar">
          <label class="scope-source"
            ><i data-lucide="database"></i
            ><select id="source-select" aria-label="选择数据来源">
              <option value="all">全部来源</option>
            </select></label
          >
          <div class="scope-divider"></div>
          <label
            ><i data-lucide="calendar-days"></i
            ><select id="range" aria-label="时间范围">
              <option value="1">最近 24 小时</option>
              <option value="7" selected>最近 7 天</option>
              <option value="30">最近 30 天</option>
            </select></label
          ><span id="scope-caption" class="scope-caption"
            >等待真实采集结果</span
          >
        </div>
        <section id="analysis-view" class="view">
          <div id="metrics" class="metrics" aria-live="polite"></div>
          <div id="insight" class="insight-line"></div>
          <div class="chart-grid">
            <section class="chart-section">
              <div class="section-heading">
                <div>
                  <h2 id="main-chart-title">采集观测趋势</h2>
                  <span id="trend-caption" class="muted"></span>
                </div>
                <div class="chart-controls">
                  <select id="chart-mode" aria-label="分析图类型">
                    <option value="trend">快照趋势</option>
                    <option value="ranking">指标排行</option>
                    <option value="scatter">指标关联</option></select
                  ><select id="trend-metric" aria-label="趋势指标">
                    <option value="count">记录数</option></select
                  ><select
                    id="second-metric"
                    aria-label="关联纵轴指标"
                    hidden
                  ></select>
                </div>
              </div>
              <div
                id="trend-chart"
                class="chart"
                role="img"
                aria-label="采集快照时间趋势"
              ></div>
              <div id="trend-footer" class="chart-footer"></div>
            </section>
            <section class="chart-section">
              <div class="section-heading">
                <div>
                  <h2 id="distribution-title">来源构成</h2>
                  <span id="distribution-caption" class="muted"
                    >各来源最新快照</span
                  >
                </div>
                <select
                  id="distribution-field"
                  aria-label="分布分析字段"
                  hidden
                ></select>
              </div>
              <div
                id="distribution-chart"
                class="chart"
                role="img"
                aria-label="数据分布图"
              ></div>
              <div id="distribution-footer" class="chart-footer"></div>
            </section>
          </div>
          <section class="explorer">
            <div class="section-heading explorer-heading">
              <div>
                <h2>数据明细 <span id="data-total" class="count"></span></h2>
                <p id="table-caption" class="muted">每个来源的最新成功快照</p>
              </div>
              <button id="export" class="secondary">
                <i data-lucide="download"></i>导出 CSV
              </button>
            </div>
            <div class="table-tools">
              <div
                class="segmented"
                id="change-tabs"
                role="group"
                aria-label="变化筛选"
              >
                <button data-change="all" class="active">全部</button
                ><button data-change="changed">有变化</button
                ><button data-change="added">新出现</button
                ><button data-change="stable">未变化</button>
              </div>
              <div class="table-controls">
                <label class="search-box"
                  ><i data-lucide="search"></i
                  ><input
                    id="search"
                    type="search"
                    placeholder="搜索标题、作者或字段…"
                    aria-label="搜索数据" /></label
                ><select id="sort" aria-label="数据排序">
                  <option value="rank">来源排名</option>
                  <option value="title">标题排序</option>
                  <option value="score">指标从高到低</option>
                  <option value="scoreDelta">指标增量</option>
                  <option value="rankDelta">排名上升</option>
                </select>
              </div>
            </div>
            <div id="data-table" class="table-scroll"></div>
            <div class="pagination">
              <span id="page-caption"></span>
              <div>
                <label
                  >每页
                  <select id="page-size" aria-label="每页条数">
                    <option>15</option>
                    <option>30</option>
                    <option>60</option>
                  </select></label
                ><button
                  id="previous-page"
                  class="icon-button"
                  title="上一页"
                  aria-label="上一页"
                >
                  <i data-lucide="chevron-left"></i></button
                ><span id="page-number"></span
                ><button
                  id="next-page"
                  class="icon-button"
                  title="下一页"
                  aria-label="下一页"
                >
                  <i data-lucide="chevron-right"></i>
                </button>
              </div>
            </div>
          </section>
        </section>
        <section id="compare-view" class="view" hidden>
          <div class="compare-controls">
            <label
              >基准快照<select
                id="compare-before"
                aria-label="基准快照"
              ></select></label
            ><i data-lucide="arrow-right"></i
            ><label
              >对比快照<select id="compare-after" aria-label="对比快照"></select
            ></label>
          </div>
          <div id="compare-summary" class="metrics"></div>
          <p id="compare-note" class="muted"></p>
          <div id="comparison-table" class="table-scroll"></div>
        </section>
        <section id="health-view" class="view" hidden>
          <div id="health-summary" class="metrics"></div>
          <div id="health-table" class="table-scroll"></div>
        </section>
        <section id="runs-view" class="view" hidden>
          <div class="table-tools">
            <h2>采集记录 <span id="run-count" class="count"></span></h2>
            <select id="run-status" aria-label="运行状态">
              <option value="all">全部状态</option>
              <option value="failed">失败</option>
              <option value="succeeded">成功</option>
            </select>
          </div>
          <div id="runs-table" class="table-scroll"></div>
        </section>
        <footer class="page-footer">
          <span id="data-boundary">数据来自持久化采集快照</span
          ><span>GoRelay / Task &amp; Data Workspace</span>
        </footer>
      </main>
    </div>
    <dialog id="detail-dialog" class="detail-dialog">
      <header>
        <div>
          <span class="eyebrow" id="detail-source"></span>
          <h2 id="detail-title">数据详情</h2>
        </div>
        <button
          class="icon-button"
          data-close="detail-dialog"
          title="关闭"
          aria-label="关闭详情"
        >
          <i data-lucide="x"></i>
        </button>
      </header>
      <div id="detail-body" class="detail-body"></div>
    </dialog>
    <dialog id="collect-dialog" class="collect-dialog">
      <form id="collect-form">
        <header>
          <h2>新建采集任务</h2>
          <button
            type="button"
            class="icon-button"
            data-close="collect-dialog"
            aria-label="关闭采集窗口"
          >
            <i data-lucide="x"></i>
          </button>
        </header>
        <label>采集规则<select id="collect-rule" required></select></label
        ><label>目标地址<input id="collect-url" type="url" required /></label>
        <p id="collect-script" class="muted"></p>
        <p id="collect-error" role="alert"></p>
        <footer>
          <button type="button" class="secondary" data-close="collect-dialog">
            取消</button
          ><button id="submit-collect" type="submit" class="primary">
            <i data-lucide="play"></i>提交任务
          </button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
